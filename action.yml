name: js-covergrid
description: >-
  JavaScript coverage in one PR comment, drawn as a grid map: tiles sized by statements,
  coloured by coverage.
author: gringolito

branding:
  icon: grid
  color: green

inputs:
  coverage-summary:
    description: >-
      Path to the Istanbul json-summary file your test tool writes, e.g. Vitest with
      `coverage.reporter` including 'json-summary'.
    required: true
    default: coverage/coverage-summary.json
  github-token:
    description: >-
      Token used to look up the baseline run, download its artifact and post the comment.
      Needs contents:read, actions:read and pull-requests:write.
    required: true
    default: ${{ github.token }}
  base-branch:
    description: Branch the baseline is taken from, and the branch coverage is compared against.
    required: false
    default: ${{ github.event.repository.default_branch || 'main' }}
  breakdown-artifact:
    description: >-
      Artifact name the breakdown file is uploaded as, and looked up under on the baseline
      run. Changing it orphans every existing baseline.
    required: false
    default: coverage-breakdown
  attachment-token:
    description: >-
      Optional. Personal access token for uploading the Grid Map image. Fine-grained: scoped to
      the repository with "Pull requests: Read and write". Classic: the repo scope. GITHUB_TOKEN
      and GitHub App tokens are rejected.
    required: false
    default: ''
  package-depth:
    description: >-
      Folders kept in a package name, counted from the deepest folder every file shares.
      Files in deeper folders count towards their ancestor at this depth: when every file is
      under app/, 2 turns app/src/components/Button/index.tsx into app/src/components. 0 keeps
      every folder as its own package.
    required: false
    default: '0'

outputs:
  total-coverage:
    description: Total coverage ratio as a percentage, to one decimal, e.g. "76.8".
    value: ${{ steps.grid-map.outputs.total-coverage }}
  total-statements:
    description: Total statements counted across every package.
    value: ${{ steps.grid-map.outputs.total-statements }}
  covered-statements:
    description: Covered statements across every package.
    value: ${{ steps.grid-map.outputs.covered-statements }}
  package-count:
    description: Number of packages drawn as tiles on the Grid Map.
    value: ${{ steps.grid-map.outputs.package-count }}
  grid-map-path:
    description: Path to the rendered Grid Map SVG under RUNNER_TEMP.
    value: ${{ steps.grid-map.outputs.grid-map-path }}
  grid-map-url:
    description: Uploaded Grid Map URL, empty when no attachment-token is set or the upload failed.
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - name: Prepare workspace
      id: prepare
      shell: bash
      env:
        IS_PULL_REQUEST: >-
          ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' ||
          github.event.issue.pull_request != null) && 'true' || 'false' }}
      run: |
        set -euo pipefail
        work="${RUNNER_TEMP}/js-covergrid"
        mkdir -p "${work}"
        {
          echo "work=${work}"
          echo "breakdown=${work}/coverage-breakdown.txt"
          echo "baseline-breakdown=${work}/baseline/coverage-breakdown.txt"
          echo "grid-map=${work}/grid-map.svg"
          echo "is-pull-request=${IS_PULL_REQUEST}"
        } >>"$GITHUB_OUTPUT"

    - name: Fetch the baseline breakdown file
      id: baseline
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        BREAKDOWN_ARTIFACT: ${{ inputs.breakdown-artifact }}
        BASELINE_PATH: ${{ steps.prepare.outputs.baseline-breakdown }}
      run: node "${GITHUB_ACTION_PATH}/src/fetch-baseline.js"

    - name: Convert the coverage summary
      shell: bash
      env:
        SUMMARY_PATH: ${{ inputs.coverage-summary }}
        BREAKDOWN_PATH: ${{ steps.prepare.outputs.breakdown }}
      run: node "${GITHUB_ACTION_PATH}/src/convert-summary.js"

    - name: Upload the breakdown file for the next run's baseline
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.breakdown-artifact }}
        path: ${{ steps.prepare.outputs.breakdown }}
        if-no-files-found: warn

    - name: Render the Grid Map
      id: grid-map
      shell: bash
      env:
        BREAKDOWN_PATH: ${{ steps.prepare.outputs.breakdown }}
        OUTPUT_PATH: ${{ steps.prepare.outputs.grid-map }}
        PACKAGE_DEPTH: ${{ inputs.package-depth }}
      run: |
        set -euo pipefail
        if [[ ! -f "$BREAKDOWN_PATH" ]]; then
          echo "::warning::No breakdown file, because the coverage summary could not be read; skipping the grid map."
          exit 0
        fi
        node "${GITHUB_ACTION_PATH}/src/render-gridmap.js"

    - name: Publish the Grid Map
      id: publish
      if: inputs.attachment-token != '' && steps.prepare.outputs.is-pull-request == 'true'
      shell: bash
      env:
        ATTACHMENT_TOKEN: ${{ inputs.attachment-token }}
        REPOSITORY_ID: ${{ github.event.repository.id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-image.sh" "${{ steps.prepare.outputs.grid-map }}"

    - name: Post the pull request comment
      if: steps.prepare.outputs.is-pull-request == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SUMMARY_PATH: ${{ inputs.coverage-summary }}
        HAS_BASELINE: ${{ steps.baseline.outputs.path != '' }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        CURRENT_BREAKDOWN_PATH: ${{ steps.prepare.outputs.breakdown }}
        BASE_BREAKDOWN_PATH: ${{ steps.baseline.outputs.path }}
        IMAGE_URL: ${{ steps.publish.outputs.url }}
        PACKAGE_DEPTH: ${{ inputs.package-depth }}
      run: node "${GITHUB_ACTION_PATH}/src/post-comment.js"
